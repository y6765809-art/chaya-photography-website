<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הפנייה התקבלה — חיה סגל צילום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Assistant',sans-serif;background:linear-gradient(135deg,#F5EFEA 0%,#FDF5F8 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:28px;padding:56px 48px;max-width:520px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(180,130,90,0.18);animation:up 0.6s ease}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.check{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#2E7D52,#4CAF7A);color:#fff;font-size:2.4rem;display:flex;align-items:center;justify-content:center;margin:0 auto 28px;box-shadow:0 10px 32px rgba(46,125,82,0.28);animation:pop 0.5s 0.3s both cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.logo-wrap{margin-bottom:20px}
.logo-wrap img{max-height:60px;max-width:200px;object-fit:contain}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:2rem;font-weight:600;color:#2C2318;margin-bottom:12px}
.sub{color:#6B5A4E;font-size:1rem;line-height:1.8;margin-bottom:10px}
.mail-note{color:#D4A574;font-size:0.9rem;font-weight:600;margin-bottom:32px}
.divider{color:#D4A574;letter-spacing:12px;margin-bottom:32px;font-size:0.85rem}
.btn-back{display:inline-block;background:linear-gradient(135deg,#D4A574,#B8936A);color:#fff;text-decoration:none;padding:14px 42px;border-radius:30px;font-weight:700;font-size:0.95rem;box-shadow:0 6px 22px rgba(212,165,116,0.38);transition:all 0.2s;font-family:'Assistant',sans-serif}
.btn-back:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(212,165,116,0.48)}
.phone{margin-top:22px;color:#B0A098;font-size:0.87rem}
.phone a{color:#D4A574;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <img src="https://raw.githubusercontent.com/y6765809-art/chaya-segal-images/main/logo.png" alt="חיה סגל צילום" onerror="this.style.display='none'">
  </div>
  <div class="check">✓</div>
  <h1>תודה<span id="nameSpan"></span>!</h1>
  <p class="sub">הפנייה שלך התקבלה בהצלחה ✨<br>חיה סגל תחזור אליך בהקדם לתיאום מועד הצילום.</p>
  <p class="mail-note" id="mailNote"></p>
  <div class="divider">✦ &nbsp; ✦ &nbsp; ✦</div>
  <a href="https://y6765809-art.github.io/chaya-photography-website/" class="btn-back">🏠 חזרה לאתר</a>
  <p class="phone">לשאלות נוספות: <a href="tel:0548463238">054-846-3238</a></p>
</div>
<script>
var params=new URLSearchParams(window.location.search);
var name=params.get('n');
if(name) document.getElementById('nameSpan').textContent=', '+name;
// Show mail note if email was in referrer or just always show
document.getElementById('mailNote').textContent='📩 אישור נשלח למייל שלך';
</script>
</body>
</html>
