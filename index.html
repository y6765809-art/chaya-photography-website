<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --g:#9A7B52;--gd:#7D6241;--gl:#BFA07A;
  --c:#F0EAE0;--p:#E6DFD6;--pt:#BFA07A;--pale:#E6DFD6;
  --t:#1A1612;--b:#0E0C09;--white:#fff;
  --shadow:0 2px 16px rgba(0,0,0,0.06);
  --shadow-h:0 6px 32px rgba(0,0,0,0.1);
  --r:4px;--tr:0.3s ease;
  --font-body:'Rubik',system-ui,sans-serif;
  --font-display:'Suez One','Frank Ruhl Libre',serif;
  --font-editorial:'Frank Ruhl Libre',serif;
  --sz-hero-title:clamp(2.2rem,5vw,4.2rem);
  --sz-sec-heading:clamp(1.7rem,3.2vw,2.6rem);
  --sz-price:clamp(1.8rem,3vw,2.5rem);
}
html{scroll-behavior:smooth;scroll-padding-top:120px}
#gallery,#pkgs,#testimonials,#faq,#contact{scroll-margin-top:120px}
body{font-family:var(--font-body);background:var(--c);color:var(--t);line-height:1.78;overflow-x:hidden}

/* SALE BANNER */
.sale-banner{display:none;background:var(--t);color:var(--white);text-align:center;padding:10px 20px;font-size:0.82rem;font-weight:400;position:fixed;top:0;left:0;right:0;z-index:1000;letter-spacing:0.1em}
.sale-banner.visible{display:block}
.sale-banner+.navbar{top:42px}
.sale-banner.visible~#app .navbar{top:42px}
body.has-banner .navbar{top:42px}
body.has-banner #home{padding-top:122px}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--white);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s,visibility 0.5s}
#loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
.spinner{width:44px;height:44px;border:1.5px solid var(--pale);border-top-color:var(--g);border-radius:50%;animation:spin 0.9s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--g);font-size:0.72rem;font-weight:400;letter-spacing:0.18em;text-transform:uppercase}

/* SCROLL PROGRESS */
#scrollProg{position:fixed;top:0;left:0;right:0;height:2px;background:var(--g);transform-origin:right;transform:scaleX(0);z-index:9998;transition:transform 0.08s linear}

/* NAVBAR */
.navbar{position:fixed;top:0;left:0;right:0;height:120px;background:rgba(240,234,224,0.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,0);z-index:999;padding:0 40px;display:flex;justify-content:space-between;align-items:center;transition:border-color var(--tr)}
.navbar.scrolled{border-bottom-color:rgba(0,0,0,0.07)}
.nav-logo{height:110px;cursor:pointer;object-fit:contain;transition:opacity var(--tr)}
.nav-logo:hover{opacity:0.72}
.nav-menu{display:flex;gap:26px;list-style:none;align-items:center}
.nav-menu a{text-decoration:none;color:var(--t);font-weight:400;cursor:pointer;font-size:0.8rem;transition:color var(--tr);padding:4px 0;position:relative;letter-spacing:0.06em}
.nav-menu a::after{content:'';position:absolute;bottom:-2px;right:0;left:0;height:1px;background:var(--g);transform:scaleX(0);transition:transform var(--tr)}
.nav-menu a:hover,.nav-menu a.active{color:var(--g)}
.nav-menu a:hover::after,.nav-menu a.active::after{transform:scaleX(1)}
.nav-cta{color:var(--g)!important;border:1px solid var(--g)!important;padding:7px 18px!important;border-radius:0!important;font-weight:500!important;letter-spacing:0.1em!important;font-size:0.74rem!important;text-transform:uppercase!important}
.nav-cta::after{display:none!important}
.nav-cta:hover{background:var(--g)!important;color:var(--white)!important}
.nav-book-btn{background:transparent;color:var(--g)!important;padding:8px 22px;border:1px solid var(--g);text-decoration:none;font-weight:500;font-size:0.74rem;cursor:pointer;white-space:nowrap;transition:all var(--tr);flex-shrink:0;letter-spacing:0.1em;text-transform:uppercase}
.nav-book-btn:hover{background:var(--g);color:var(--white)!important}
@media(max-width:768px){.nav-book-btn{font-size:0.68rem;padding:6px 14px}}

/* HAMBURGER */
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px;z-index:1001;border:none;background:none}
.hamburger span{display:block;width:22px;height:1.5px;background:var(--t);transition:all var(--tr)}
.hamburger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.hamburger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}

/* MOBILE NAV */
.mobile-nav{position:fixed;inset:0;background:rgba(255,255,255,0.99);backdrop-filter:blur(12px);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;transform:translateX(100%);transition:transform 0.4s cubic-bezier(0.4,0,0.2,1)}
.mobile-nav.open{transform:translateX(0)}
.mobile-nav a{font-size:1.25rem;font-weight:300;color:var(--t);text-decoration:none;transition:color var(--tr);cursor:pointer;letter-spacing:0.06em}
.mobile-nav a:hover{color:var(--g)}
.mob-cta{background:transparent!important;color:var(--g)!important;border:1px solid var(--g)!important;padding:12px 44px!important;font-size:0.82rem!important;letter-spacing:0.14em!important;text-transform:uppercase!important}

/* HERO */
.hero{min-height:100vh;display:flex;background:var(--c);position:relative;overflow:hidden}
.hero::before{display:none}
.hero-inner{display:none}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
.logo-big{max-width:270px;width:68%;margin-bottom:26px}
.hero-tagline{font-size:0.64rem;color:rgba(255,255,255,0.52);margin-bottom:18px;letter-spacing:0.3em;font-weight:400;text-transform:uppercase}
.hero-highlight{font-family:var(--font-display);font-size:var(--sz-hero-title);font-weight:400;color:#fff;margin-bottom:14px;line-height:1.18;letter-spacing:0.03em}
.hero-subline{font-size:0.97rem;color:rgba(255,255,255,0.58);margin-bottom:30px;font-weight:300;letter-spacing:0.07em}
.hero-cta{display:inline-block;padding:12px 36px;border:1px solid rgba(255,255,255,0.6);color:#fff;text-decoration:none;font-size:0.76rem;font-weight:400;letter-spacing:0.16em;text-transform:uppercase;transition:all var(--tr)}
.hero-cta:hover{background:rgba(255,255,255,0.1);border-color:#fff}
.hero-icons{display:flex;justify-content:center;gap:40px;margin-top:28px;flex-wrap:wrap}
.hero-icon{text-align:center;transition:opacity var(--tr)}
.hero-icon:hover{opacity:0.72}
.hero-icon img{width:68px;height:68px;object-fit:contain;margin-bottom:8px;filter:brightness(0) invert(1) opacity(0.65)}
.hero-icon p{font-size:0.68rem;color:rgba(255,255,255,0.45);font-weight:400;letter-spacing:0.1em;text-transform:uppercase}

/* HERO SLIDESHOW */
.hero-slides{position:absolute;inset:0;overflow:hidden;z-index:0}
.hero-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2s ease}
.hero-slide.hs-on{opacity:1}
.scroll-ind{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);width:26px;height:42px;border:2px solid rgba(255,255,255,0.55);border-radius:13px;z-index:4;cursor:pointer}
.scroll-ind::after{content:'';display:block;width:4px;height:8px;background:rgba(255,255,255,0.75);border-radius:2px;margin:6px auto 0;animation:scrollDot 1.8s ease-in-out infinite}
@keyframes scrollDot{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(16px)}}
.hero-veil{display:none}
#heroCanvas{position:absolute;inset:0;z-index:2;pointer-events:none;width:100%;height:100%}
.hero .hero-inner{display:none}
.hero-badge{display:none}
/* Hero intro — text block below full-screen photo */
.hero-intro{padding:72px 20px 80px;background:var(--c);text-align:center}
.hero-intro-tag{font-size:0.64rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--g);margin-bottom:20px;font-weight:400}
.hero-intro-title{font-family:var(--font-editorial);font-size:var(--sz-hero-title);font-weight:400;color:var(--t);margin-bottom:16px;line-height:1.2;letter-spacing:0.02em}
.hero-intro-sub{font-size:0.97rem;color:#9A8878;margin-bottom:36px;letter-spacing:0.05em;font-weight:300}
.hero-intro-cta{display:inline-block;padding:13px 40px;border:1px solid var(--g);color:var(--g);text-decoration:none;font-size:0.76rem;letter-spacing:0.18em;text-transform:uppercase;transition:all var(--tr)}
.hero-intro-cta:hover{background:var(--g);color:var(--white)}
.badge-ring{transform-origin:85px 85px;animation:badge-spin 18s linear infinite}
@keyframes badge-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.badge-ring{animation:none}}
@media(max-width:600px){.hero-badge{width:96px;height:96px;bottom:14px;left:10px}}

/* SECTION COMMON */
.sec-wrap{text-align:center;margin-bottom:64px}
.sec-title{font-family:var(--font-display);font-size:var(--sz-sec-heading);margin-bottom:14px;line-height:1.2;font-weight:400;letter-spacing:0.04em}
.sec-sub{color:#9A8878;font-size:0.9rem;max-width:420px;margin:0 auto;line-height:1.75;letter-spacing:0.03em}
.sec-line{width:34px;height:1px;background:var(--g);margin:18px auto 0}

/* REVEAL ANIMATIONS */
.reveal{opacity:0;transform:translateY(28px);transition:opacity 0.6s ease,transform 0.6s ease}
.reveal.vis{opacity:1;transform:none}
.rd1{transition-delay:0.08s}.rd2{transition-delay:0.16s}.rd3{transition-delay:0.24s}.rd4{transition-delay:0.32s}

/* STATS */
.stats{background:#EDE8E0;padding:64px 20px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:860px;margin:0 auto}
.stat{color:var(--t);text-align:center}
.stat-num{font-family:var(--font-display);font-size:clamp(2.2rem,4vw,3.2rem);font-weight:400;line-height:1;display:block;letter-spacing:0.02em}
.stat-label{font-size:0.82rem;opacity:0.55;margin-top:10px;letter-spacing:0.2em;text-transform:uppercase;font-weight:400}

/* GALLERY */
.gallery{padding:48px 20px 100px}
.gal-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;max-width:1180px;margin:0 auto;padding:0 20px}
.gal-card{border-radius:0;overflow:hidden;box-shadow:none;transition:opacity var(--tr);cursor:pointer;position:relative;background:#c8b09a;flex:0 0 calc(33.333% - 14px);width:calc(33.333% - 14px);aspect-ratio:1/1}
.gal-card:hover{opacity:0.88}
.gal-img-wrap{overflow:hidden;width:100%;height:100%;position:absolute;inset:0}
.gal-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform 0.9s ease;display:block}
.gal-card:hover .gal-img-wrap img{transform:scale(1.04)}
.gal-info-overlay{position:absolute;bottom:0;left:0;right:0;padding:60px 20px 20px;background:linear-gradient(to top,rgba(0,0,0,0.72) 0%,rgba(0,0,0,0.2) 55%,transparent 100%);z-index:2}
.gal-name{font-family:var(--font-display);font-size:1.2rem;font-weight:400;color:var(--white);line-height:1.2;margin-bottom:4px;letter-spacing:0.03em}
.gal-desc{color:rgba(255,255,255,0.62);font-size:0.74rem;margin-bottom:8px;opacity:0;transform:translateY(4px);transition:opacity 0.3s ease,transform 0.3s ease;letter-spacing:0.06em}
.gal-card:hover .gal-desc{opacity:1;transform:translateY(0)}
.gal-zoom-pill{display:inline-flex;align-items:center;gap:5px;color:rgba(255,255,255,0.8);font-size:0.7rem;background:rgba(255,255,255,0.12);padding:4px 12px;opacity:0;transform:translateY(4px);transition:opacity 0.3s 0.05s ease,transform 0.3s 0.05s ease;letter-spacing:0.06em}
.gal-card:hover .gal-zoom-pill{opacity:1;transform:translateY(0)}

/* ALL-PHOTOS CARD */
.gal-all{display:block;width:100%;border-radius:0;overflow:hidden;cursor:pointer;position:relative;height:200px;background:var(--t);margin-bottom:28px;box-shadow:none;transition:opacity var(--tr)}
.gal-all:hover{opacity:0.88}
.gal-all-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 0.8s ease}
.gal-all:hover .gal-all-bg{transform:scale(1.03)}
.gal-all-overlay{position:absolute;inset:0;background:rgba(10,6,3,0.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.gal-all-play{width:58px;height:58px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.65);display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:rgba(255,255,255,0.85);transition:all var(--tr)}
.gal-all:hover .gal-all-play{border-color:#fff;transform:scale(1.07)}
.gal-all-label{color:rgba(255,255,255,0.9);font-family:var(--font-display);font-size:1.4rem;font-weight:400;letter-spacing:0.04em}
.gal-all-sub{color:rgba(255,255,255,0.5);font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase}

/* SLIDESHOW */
.slideshow{position:fixed;inset:0;background:#000;z-index:9995;display:none;flex-direction:column}
.slideshow.ss-open{display:flex}
.ss-bar{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);flex-shrink:0}
.ss-counter{color:rgba(255,255,255,0.55);font-size:0.82rem;min-width:56px;font-variant-numeric:tabular-nums}
.ss-title-bar{color:var(--white);font-family:var(--font-display);font-size:1.1rem;font-weight:600;letter-spacing:0.03em}
.ss-ctrls{display:flex;gap:9px}
.ss-ctrl{background:rgba(255,255,255,0.1);border:none;color:var(--white);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.95rem;transition:background var(--tr);flex-shrink:0}
.ss-ctrl:hover{background:rgba(255,255,255,0.22)}
.ss-speed-btn{width:auto;padding:0 12px;border-radius:18px;font-size:0.78rem;font-weight:700;letter-spacing:0.04em;background:rgba(212,165,116,0.28);color:var(--gl)}
.ss-speed-btn:hover{background:rgba(212,165,116,0.5)}
.ss-body{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
.ss-img{max-width:96vw;max-height:80vh;object-fit:contain;display:block;transition:opacity 0.35s ease;border-radius:4px}
.ss-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);border:none;color:white;width:50px;height:50px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.55rem;transition:background var(--tr);z-index:2;flex-shrink:0}
.ss-nav:hover{background:rgba(212,165,116,0.5)}
.ss-nav-r{right:14px}
.ss-nav-l{left:14px}
.ss-cap{position:absolute;bottom:0;left:0;right:0;padding:16px 24px;background:linear-gradient(to top,rgba(0,0,0,0.65),transparent);color:rgba(255,255,255,0.82);text-align:center;font-size:0.93rem;font-weight:600;pointer-events:none}
.ss-foot{padding:10px 20px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);flex-shrink:0}
.ss-prog{height:3px;background:rgba(255,255,255,0.15);border-radius:2px;width:100%;max-width:380px;overflow:hidden}
.ss-prog-fill{height:100%;background:linear-gradient(to right,var(--g),var(--pt));border-radius:2px;width:0%}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.93);z-index:9990;display:none;align-items:center;justify-content:center}
.lightbox.active{display:flex}
.lb-img-wrap{position:relative;max-width:92vw;max-height:88vh;display:flex;align-items:center;justify-content:center}
.lb-img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:8px;animation:lbIn 0.28s ease;box-shadow:0 20px 60px rgba(0,0,0,0.5);display:block}
@keyframes lbIn{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}
.lb-btn{position:fixed;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.12);border:none;color:var(--white);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--tr);z-index:9991}
.lb-btn:hover{background:rgba(255,255,255,0.25)}
.lb-close{top:18px;left:20px;font-size:1.5rem}
.lb-prev{top:50%;transform:translateY(-50%);right:16px}
.lb-next{top:50%;transform:translateY(-50%);left:16px}
.lb-caption{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);color:var(--white);font-size:1rem;font-weight:600;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);padding:8px 22px;border-radius:22px;white-space:nowrap}
.lb-dots{position:fixed;bottom:65px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.lb-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.35);cursor:pointer;transition:background var(--tr)}
.lb-dot.active{background:var(--white)}

/* PACKAGES */
.pkgs{padding:48px 20px 100px;background:var(--c)}
.pkgs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:1px;max-width:1180px;margin:0 auto;background:#D4CCBF}
.pkg{background:var(--white);border-radius:0;padding:44px 36px 40px;box-shadow:none;transition:background var(--tr);position:relative;overflow:hidden}
.pkg::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:transparent;transition:background var(--tr)}
.pkg:hover{background:#FDFBF8}
.pkg:hover::after{background:var(--g)}
.pkg.featured{background:#FDFBF8}
.pkg.featured::after{background:var(--g)}
.pkg-badge{position:absolute;top:22px;left:22px;background:transparent;color:var(--g);padding:0;font-size:0.66rem;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;box-shadow:none}
.pkg-name{font-family:var(--font-display);font-size:clamp(1.4rem,2.5vw,1.9rem);margin-bottom:12px;font-weight:400;line-height:1;letter-spacing:0.03em}
.pkg.featured .pkg-name{color:var(--gd)}
.pkg-price{font-size:var(--sz-price);color:var(--t);font-weight:300;margin-bottom:4px;line-height:1;letter-spacing:0.01em}
.pkg.featured .pkg-price{color:var(--gd)}
.pkg-sub{color:#A89880;margin-bottom:24px;font-size:0.8rem;padding-bottom:22px;border-bottom:1px solid #EAE4DC;letter-spacing:0.04em}

async function loadData(){
  try{
    var url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv';
    var res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    var csv=await res.text();
    var d={};
    csv.split('\n').forEach(function(line){
      line=line.trim();
      if(!line) return;
      var m=line.match(/^"?([^",\r\n]+)"?,\s*"?(.*?)"?\s*\r?$/);
      if(m&&m[1]&&m[2]&&m[1].trim()!=='key'){
        d[m[1].trim()]=m[2].trim();
      }
    });
    if(d.logo||d.cat1_name){
      var merged=Object.assign({},FB,d);
      return merged;
    }
    return FB;
  }catch(e){
    return FB;
  }
}

  return '<div class="stat"><span class="stat-num" data-target="'+val+'">0</span><span class="stat-label">'+lab+'</span></div>';
}

function fitBadgeText(retry){
  var textEl=document.getElementById('badge-text');
  var tpEl=document.getElementById('badge-tp');
  if(!textEl||!tpEl) return;
  tpEl.style.letterSpacing='';
  var C=477.5; // 2π×76 — hardcoded circumference so getTotalLength() on defs path is not needed
  var L=textEl.getComputedTextLength();
  if(L<=0){
    // Not yet rendered — retry up to 5 times with increasing delay
    if((retry||0)<5) setTimeout(function(){fitBadgeText((retry||0)+1);},100*(((retry||0)+1)));
    return;
  }
  var n=(tpEl.textContent||'').trim().length;
  if(n<2) return;
  var spacing=(C-L)/n;
  if(spacing<-1) spacing=-1; // prevent extreme crunch
  tpEl.style.letterSpacing=spacing.toFixed(4)+'px';
}

function initApp(){
  var bar=document.getElementById('scrollProg');
  window.addEventListener('scroll',function(){
    var doc=document.documentElement;
    var pct=window.scrollY/(doc.scrollHeight-doc.clientHeight);
    if(bar) bar.style.transform='scaleX('+Math.min(pct,1)+')';
    var nav=document.getElementById('navbar');
    if(nav) nav.classList.toggle('scrolled',window.scrollY>50);
    var bt=document.getElementById('backTop');
    if(bt) bt.classList.toggle('vis',window.scrollY>400);
    updateActiveNav();
  },{passive:true});

  // Reveal on scroll
  var obs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){e.target.classList.add('vis');obs.unobserve(e.target);}
    });
  },{threshold:0.08,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal').forEach(function(el){obs.observe(el);});

  // Counter animation
  var cObs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        var el=e.target;
        var target=+el.dataset.target;
        var steps=60,dur=1800,cur=0,inc=target/steps;
        var t=setInterval(function(){
          cur=Math.min(cur+inc,target);
          el.textContent=Math.round(cur).toLocaleString('he-IL');
          if(cur>=target){clearInterval(t);el.textContent=target.toLocaleString('he-IL');}
        },dur/steps);
        cObs.unobserve(el);
      }
    });
  },{threshold:0.3});
  document.querySelectorAll('[data-target]').forEach(function(el){cObs.observe(el);});

  // Lightbox controls
  var lb=document.getElementById('lightbox');
  if(lb){
    lb.addEventListener('click',function(e){if(e.target===lb)closeLb();});
    document.getElementById('lbClose').addEventListener('click',closeLb);
    document.getElementById('lbPrev').addEventListener('click',function(){goLb(1);});
    document.getElementById('lbNext').addEventListener('click',function(){goLb(-1);});
    document.addEventListener('keydown',function(e){
      if(!lb.classList.contains('active')) return;
      if(e.key==='Escape') closeLb();
      if(e.key==='ArrowLeft'||e.key==='ArrowDown') goLb(-1);
      if(e.key==='ArrowRight'||e.key==='ArrowUp') goLb(1);
    });
    // Touch swipe
    var tx=0;
    lb.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
    lb.addEventListener('touchend',function(e){
      var dx=e.changedTouches[0].clientX-tx;
      if(Math.abs(dx)>50) goLb(dx>0?-1:1);
    });
  }
  initTestCarousel();
}

var ssIndex=0, ssTimer=null, ssPlaying=true, ssSpeedIdx=0;
var SS_SPEEDS=[{label:'רגיל',delay:4200},{label:'מהיר',delay:1800},{label:'ידני',delay:0}];
var SS_DELAY=SS_SPEEDS[0].delay;

function openSS(startIdx){
  if(!galItems.length) return;
  ssIndex=(startIdx||0);
  ssPlaying=true;
  var el=document.getElementById('slideshow');
  if(el) el.classList.add('ss-open');
  document.body.style.overflow='hidden';
  ssShow(ssIndex);
  ssAutoPlay();
  var tb=document.getElementById('ssTitleBar');
  if(tb) tb.textContent='כל התמונות';
}

function closeSS(){
  var el=document.getElementById('slideshow');
  if(el) el.classList.remove('ss-open');
  document.body.style.overflow='';
  if(ssTimer){clearInterval(ssTimer);ssTimer=null;}
}

function ssShow(i){
  if(!galItems.length) return;
  ssIndex=((i%galItems.length)+galItems.length)%galItems.length;
  var img=document.getElementById('ssImg');
  var cap=document.getElementById('ssCap');
  var counter=document.getElementById('ssCounter');
  if(img){
    img.onerror=function(){moveSS(1);};
    img.style.opacity='0';
    setTimeout(function(){
      if(galItems[ssIndex]){img.src=galItems[ssIndex].src;img.alt=galItems[ssIndex].name||'';}
      img.style.opacity='1';
    },220);
  }
  if(cap&&galItems[ssIndex]) cap.textContent=galItems[ssIndex].name||'';
  if(counter) counter.textContent=(ssIndex+1)+' / '+galItems.length;
  var fill=document.getElementById('ssProgFill');
  if(fill){
    fill.style.transition='none';fill.style.width='0%';
    void fill.offsetWidth;
    fill.style.transition='width '+SS_DELAY+'ms linear';fill.style.width='100%';
  }
}

function moveSS(dir){
  if(ssTimer){clearInterval(ssTimer);ssTimer=null;}
  ssShow(ssIndex+dir);
  if(ssPlaying) ssAutoPlay();
}

function ssAutoPlay(){
  if(ssTimer){clearInterval(ssTimer);ssTimer=null;}
  ssTimer=setInterval(function(){ssShow(ssIndex+1);},SS_DELAY);
  var btn=document.getElementById('ssPlayBtn');
  if(btn) btn.textContent='⏸';
}

function ssPause(){
  if(ssTimer){clearInterval(ssTimer);ssTimer=null;}
  var fill=document.getElementById('ssProgFill');
  if(fill){fill.style.transition='none';}
  var btn=document.getElementById('ssPlayBtn');
  if(btn) btn.textContent='▶';
}

function toggleSSPlay(){
  if(SS_DELAY===0) return; // manual mode — play button has no effect
  ssPlaying=!ssPlaying;
  ssPlaying?ssAutoPlay():ssPause();
}

function cycleSSSpeed(){
  ssSpeedIdx=(ssSpeedIdx+1)%SS_SPEEDS.length;
  var sp=SS_SPEEDS[ssSpeedIdx];
  SS_DELAY=sp.delay;
  var btn=document.getElementById('ssSpeedBtn');
  if(btn) btn.textContent=sp.label;
  var playBtn=document.getElementById('ssPlayBtn');
  if(sp.delay===0){
    ssPause();
    ssPlaying=false;
    if(playBtn) playBtn.style.opacity='0.35';
  }else{
    ssPlaying=true;
    ssAutoPlay();
    if(playBtn) playBtn.style.opacity='1';
  }
}

function initSS(){
  var ssEl=document.getElementById('slideshow');
  if(!ssEl) return;
  document.addEventListener('keydown',function(e){
    if(!ssEl.classList.contains('ss-open')) return;
    if(e.key==='Escape') closeSS();
    else if(e.key==='ArrowLeft'||e.key==='ArrowDown') moveSS(1);
    else if(e.key==='ArrowRight'||e.key==='ArrowUp') moveSS(-1);
    else if(e.key===' '){e.preventDefault();toggleSSPlay();}
  });
  var tx=0;
  ssEl.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
  ssEl.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-tx;
    if(Math.abs(dx)>45) moveSS(dx>0?-1:1);
  });

function initParticles(){
  var canvas=document.getElementById('heroCanvas');
  if(!canvas) return;
  var ctx=canvas.getContext('2d');
  function resize(){
    var hero=document.getElementById('home');
    canvas.width=hero?hero.offsetWidth:window.innerWidth;
    canvas.height=hero?hero.offsetHeight:window.innerHeight;
  }
  resize();
  window.addEventListener('resize',resize,{passive:true});
  var ps=[];
  for(var i=0;i<26;i++){
    ps.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,
      r:Math.random()*2.2+0.8,op:Math.random()*0.18+0.07,
      sp:Math.random()*0.3+0.12,dx:(Math.random()-0.5)*0.2,ph:Math.random()*Math.PI*2});
  }
  function frame(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ps.forEach(function(p){
      p.y-=p.sp; p.ph+=0.007; p.x+=p.dx+Math.sin(p.ph)*0.25;
      if(p.y<-8){p.y=canvas.height+8;p.x=Math.random()*canvas.width;}
      if(p.x<-8) p.x=canvas.width+8;
      if(p.x>canvas.width+8) p.x=-8;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      var g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.5);
      g.addColorStop(0,'rgba(212,165,116,'+p.op+')');
      g.addColorStop(1,'rgba(212,165,116,0)');
      ctx.fillStyle=g;
      ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  frame();
}

var CACHE_KEY='cs_site_v1';

async function fetchJ(url,ms){
  var ac=new AbortController();
  var tid=setTimeout(function(){ac.abort();},ms||6000);
  try{var r=await fetch(url,{cache:'no-store',signal:ac.signal});clearTimeout(tid);return r;}

async function loadAll(){
  var d=Object.assign({},FB);

  // Serve from localStorage cache instantly (stale-while-revalidate)
  var cached=null;
  try{
    var raw=localStorage.getItem(CACHE_KEY);
    if(raw){var c=JSON.parse(raw);if(Date.now()-c.ts<CACHE_TTL){cached=c.data;Object.assign(d,cached);}}
  }catch(e){}

  // Fetch all sources in parallel — no sequential blocking
  var ts=Date.now();
  var sheetsPromise=SHEET_ID
    ?fetchJ('https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv',3000)
    :Promise.reject('no sheet');
  var results=await Promise.allSettled([
    sheetsPromise,
    fetchJ('content.json?v='+ts,6000),
    fetchJ('gallery.json?v='+ts,6000)
  ]);

  // Google Sheets
  try{
    var sr=results[0];
    if(sr.status==='fulfilled'&&sr.value.ok){
      var csv=await sr.value.text();
      csv.split('\n').forEach(function(line){
        line=line.trim(); if(!line) return;
        var m=line.match(/^"?([^",\r\n]+)"?,\s*"?(.*?)"?\s*\r?$/);
        if(m&&m[1]&&m[2]&&m[1].trim()!=='key') d[m[1].trim()]=m[2].trim();
      });
    }
  }catch(e){}
  // content.json
  try{
    var cr=results[1];
    if(cr.status==='fulfilled'&&cr.value.ok){var cd=await cr.value.json();Object.assign(d,cd);}
  }catch(e){}
  // gallery.json
  try{
    var gr=results[2];
    if(gr.status==='fulfilled'&&gr.value.ok){
      var gal=await gr.value.json();
      // Build _gallerySlots: all photos per category for filtered gallery
      var slots=[];
      gal.forEach(function(slot,si){
        var n=si+1;
        if(slot.name) d['cat'+n+'_name']=slot.name;
        if(slot.file) d['cat'+n+'_image']=RAW_BASE+slot.file;
        if(slot.desc) d['cat'+n+'_desc']=slot.desc;
        if(slot.name){
          var photos=[];
          if(slot.file) photos.push({src:RAW_BASE+slot.file,name:slot.name});
          if(slot.images&&slot.images.length){
            slot.images.forEach(function(img){if(img)photos.push({src:RAW_BASE+img,name:slot.name});});
          }
          if(photos.length) slots.push({cat:slot.name,photos:photos});
        }
      });
      for(var x=gal.length+1;x<=8;x++){d['cat'+x+'_name']='';d['cat'+x+'_image']='';}
      if(slots.length) d._gallerySlots=slots;
    }
  }catch(e){}

  // Save fresh data to cache
  try{
    var toCache={};
    Object.keys(d).forEach(function(k){if(d[k]!==FB[k])toCache[k]=d[k];});
    localStorage.setItem(CACHE_KEY,JSON.stringify({ts:ts,data:toCache}));
  }catch(e){}

  return d;
}

  try{
    var raw=localStorage.getItem(CACHE_KEY);
    if(raw){var c=JSON.parse(raw);if(Date.now()-c.ts<CACHE_TTL){cachedD=Object.assign({},FB,c.data);}}
  }catch(e){}
  if(cachedD){
    // Render from cache instantly — user sees content right away
    render(cachedD);
  }
  // Always fetch fresh in background; re-render only if gallery changed
  loadAll().then(function(d){
    if(!cachedD){
      render(d);
    } else {
      // Silent refresh: re-render if any visible content changed
      var contentChanged=false;
      for(var i=1;i<=8;i++){
        if((d['cat'+i+'_image']||'')!==(cachedD['cat'+i+'_image']||'')){contentChanged=true;break;}
      }
      if(!contentChanged){
        var checkKeys=['stat1_num','stat1_label','stat2_num','stat2_label','stat3_num','stat3_label','stat4_num','stat4_label','hero_tagline','hero_highlight','hero_subline'];
        for(var k=0;k<checkKeys.length;k++){
          if((d[checkKeys[k]]||'')!==(cachedD[checkKeys[k]]||'')){contentChanged=true;break;}
        }
      }
      if(!contentChanged){
        // Check gallery photos changed — count total photos across all slots
        var countPhotos=function(obj){return (obj._gallerySlots||[]).reduce(function(s,sl){return s+(sl.photos||[]).length;},0);};
        if(countPhotos(d)!==countPhotos(cachedD)) contentChanged=true;
      }
      if(contentChanged) render(d);
    }
    var loading=document.getElementById('loading');
    if(loading) loading.classList.add('hidden');
  });
})();
</script>
</body>
</html>
