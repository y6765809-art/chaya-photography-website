<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="חיה סגל - צלמת ילדים ומשפחה בטבריה. צילומי חלאקה, ניובורן, סמאש קייק ומשפחה.">
<meta name="keywords" content="צלמת טבריה, צילומי ילדים, חלאקה, ניובורן, סמאש קייק, חיה סגל">
<meta property="og:title" content="חיה סגל צילום">
<meta property="og:description" content="צלמת ילדים ומשפחה בטבריה | חלאקה | ניובורן | סמאש קייק | משפחה">
<meta property="og:type" content="website">
<title>חיה סגל צילום - צלמת ילדים ומשפחה בטבריה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --g:#D4A574;--gd:#B8936A;--gl:#E8C9A8;
  --c:#F2DFCE;--p:#F5C6D0;--pt:#e8b4c0;
  --t:#2C2C2C;--b:#1A1A1A;--white:#fff;
  --shadow:0 8px 30px rgba(0,0,0,0.1);
  --shadow-h:0 16px 50px rgba(0,0,0,0.15);
  --r:18px;--tr:0.3s ease;
}
html{scroll-behavior:smooth}
body{font-family:'Assistant',system-ui,sans-serif;background:var(--white);color:var(--t);line-height:1.6;overflow-x:hidden}

/* SALE BANNER */
.sale-banner{display:none;background:linear-gradient(135deg,var(--g),var(--pt));color:var(--white);text-align:center;padding:10px 20px;font-size:0.92rem;font-weight:700;position:fixed;top:0;left:0;right:0;z-index:1000;letter-spacing:0.01em;box-shadow:0 2px 10px rgba(212,165,116,0.4)}
.sale-banner.visible{display:block}
.sale-banner+.navbar{top:42px}
.sale-banner.visible~#app .navbar{top:42px}
body.has-banner .navbar{top:42px}
body.has-banner #home{padding-top:122px}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--white);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s,visibility 0.5s}
#loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
.spinner{width:52px;height:52px;border:3px solid var(--c);border-top-color:var(--g);border-radius:50%;animation:spin 0.85s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--g);font-size:1.1rem;font-weight:600;letter-spacing:0.05em}

/* SCROLL PROGRESS */
#scrollProg{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(to right,var(--g),var(--pt));transform-origin:right;transform:scaleX(0);z-index:9998;transition:transform 0.08s linear}

/* NAVBAR */
.navbar{position:fixed;top:0;left:0;right:0;background:rgba(255,255,255,0.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 2px 20px rgba(0,0,0,0.06);z-index:999;padding:12px 30px;display:flex;justify-content:space-between;align-items:center;transition:padding var(--tr),box-shadow var(--tr)}
.navbar.scrolled{padding:8px 30px;box-shadow:0 2px 28px rgba(0,0,0,0.09)}
.nav-logo{height:45px;cursor:pointer;object-fit:contain;transition:transform var(--tr)}
.nav-logo:hover{transform:scale(1.05)}
.nav-menu{display:flex;gap:18px;list-style:none;align-items:center}
.nav-menu a{text-decoration:none;color:var(--t);font-weight:500;cursor:pointer;font-size:0.93rem;transition:color var(--tr);padding:4px 0;position:relative}
.nav-menu a::after{content:'';position:absolute;bottom:-2px;right:0;left:0;height:2px;background:var(--g);transform:scaleX(0);transition:transform var(--tr)}
.nav-menu a:hover,.nav-menu a.active{color:var(--g)}
.nav-menu a:hover::after,.nav-menu a.active::after{transform:scaleX(1)}
.nav-cta{background:var(--g)!important;color:var(--white)!important;padding:8px 20px!important;border-radius:25px!important;font-weight:700!important}
.nav-cta::after{display:none!important}
.nav-cta:hover{background:var(--gd)!important;transform:translateY(-1px)!important}

/* HAMBURGER */
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px;z-index:1001;border:none;background:none}
.hamburger span{display:block;width:24px;height:2px;background:var(--t);border-radius:2px;transition:all var(--tr)}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* MOBILE NAV */
.mobile-nav{position:fixed;inset:0;background:rgba(255,255,255,0.98);backdrop-filter:blur(12px);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transform:translateX(100%);transition:transform 0.4s cubic-bezier(0.4,0,0.2,1)}
.mobile-nav.open{transform:translateX(0)}
.mobile-nav a{font-size:1.4rem;font-weight:600;color:var(--t);text-decoration:none;transition:color var(--tr);cursor:pointer}
.mobile-nav a:hover{color:var(--g)}
.mob-cta{background:var(--g)!important;color:var(--white)!important;padding:13px 40px;border-radius:30px;font-size:1.25rem!important}

/* HERO */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--c) 0%,var(--white) 48%,var(--p) 100%);padding-top:80px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 15% 55%,rgba(212,165,116,0.18) 0%,transparent 55%),radial-gradient(ellipse at 85% 20%,rgba(245,198,208,0.22) 0%,transparent 50%);pointer-events:none}
.hero-inner{max-width:820px;padding:40px 24px;position:relative;z-index:1}
.hero-inner>*{opacity:0;transform:translateY(22px);animation:fadeUp 0.7s forwards}
.hero-inner>*:nth-child(1){animation-delay:0.15s}
.hero-inner>*:nth-child(2){animation-delay:0.27s}
.hero-inner>*:nth-child(3){animation-delay:0.38s}
.hero-inner>*:nth-child(4){animation-delay:0.48s}
.hero-inner>*:nth-child(5){animation-delay:0.58s}
.hero-inner>*:nth-child(6){animation-delay:0.68s}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
.logo-big{max-width:300px;width:75%;margin-bottom:22px;filter:drop-shadow(0 5px 18px rgba(212,165,116,0.28))}
.hero-tagline{font-size:1.05rem;color:#888;margin-bottom:6px;letter-spacing:0.02em}
.hero-highlight{font-family:'Cormorant Garamond','Frank Ruhl Libre',Georgia,serif;font-size:clamp(2rem,4.8vw,3rem);font-weight:600;color:var(--g);margin-bottom:12px;line-height:1.2;letter-spacing:0.02em}
.hero-subline{font-size:1rem;color:#777;margin-bottom:32px}
.hero-cta{display:inline-flex;align-items:center;gap:9px;background:var(--g);color:var(--white);padding:14px 36px;border-radius:30px;text-decoration:none;font-size:1.05rem;font-weight:700;transition:all var(--tr);box-shadow:0 8px 28px rgba(212,165,116,0.38)}
.hero-cta:hover{background:var(--gd);transform:translateY(-3px);box-shadow:0 14px 38px rgba(212,165,116,0.48)}
.hero-icons{display:flex;justify-content:center;gap:45px;margin-top:50px;flex-wrap:wrap}
.hero-icon{text-align:center;transition:transform var(--tr)}
.hero-icon:hover{transform:translateY(-5px)}
.hero-icon img{width:82px;height:82px;object-fit:contain;margin-bottom:8px;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.1))}
.hero-icon p{font-size:0.85rem;color:#888;font-weight:500}

/* SECTION COMMON */
.sec-wrap{text-align:center;margin-bottom:55px}
.sec-title{font-family:'Cormorant Garamond','Frank Ruhl Libre',Georgia,serif;font-size:clamp(2.2rem,4.5vw,3.4rem);margin-bottom:10px;line-height:1.12;font-weight:600;letter-spacing:0.01em}
.sec-sub{color:#888;font-size:0.98rem;max-width:480px;margin:0 auto}
.sec-line{width:55px;height:3px;background:linear-gradient(to left,var(--g),var(--pt));border-radius:3px;margin:14px auto 0}

/* REVEAL ANIMATIONS */
.reveal{opacity:0;transform:translateY(28px);transition:opacity 0.6s ease,transform 0.6s ease}
.reveal.vis{opacity:1;transform:none}
.rd1{transition-delay:0.08s}.rd2{transition-delay:0.16s}.rd3{transition-delay:0.24s}.rd4{transition-delay:0.32s}

/* STATS */
.stats{background:var(--g);padding:52px 20px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:860px;margin:0 auto}
.stat{color:var(--white);text-align:center}
.stat-num{font-family:'Frank Ruhl Libre',Georgia,serif;font-size:2.8rem;font-weight:700;line-height:1;display:block}
.stat-label{font-size:0.88rem;opacity:0.85;margin-top:6px}

/* GALLERY */
.gallery{padding:100px 20px 80px}
.gal-grid{columns:3 260px;column-gap:20px;max-width:1180px;margin:0 auto;padding:0 20px}
.gal-card{break-inside:avoid;margin-bottom:20px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:transform var(--tr),box-shadow var(--tr);cursor:pointer;position:relative;background:var(--c);display:block;width:100%}
.gal-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-h)}
.gal-img-wrap{overflow:hidden}
.gal-card:nth-child(3n+1) .gal-img-wrap{height:310px}
.gal-card:nth-child(3n+2) .gal-img-wrap{height:240px}
.gal-card:nth-child(3n) .gal-img-wrap{height:275px}
.gal-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform 0.65s ease;display:block}
.gal-card:hover .gal-img-wrap img{transform:scale(1.08)}
.gal-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.52) 0%,transparent 55%);opacity:0;transition:opacity var(--tr);display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px}
.gal-card:hover .gal-overlay{opacity:1}
.gal-overlay-txt{color:var(--white);font-size:0.9rem;font-weight:600;background:rgba(255,255,255,0.18);backdrop-filter:blur(4px);padding:6px 16px;border-radius:20px;transform:translateY(8px);transition:transform var(--tr)}
.gal-card:hover .gal-overlay-txt{transform:translateY(0)}
.gal-info{padding:18px 22px 22px}
.gal-name{font-family:'Frank Ruhl Libre',Georgia,serif;font-size:1.45rem;margin-bottom:4px}
.gal-desc{color:#888;font-size:0.88rem}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.93);z-index:9990;display:none;align-items:center;justify-content:center}
.lightbox.active{display:flex}
.lb-img-wrap{position:relative;max-width:92vw;max-height:88vh;display:flex;align-items:center;justify-content:center}
.lb-img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:8px;animation:lbIn 0.28s ease;box-shadow:0 20px 60px rgba(0,0,0,0.5);display:block}
@keyframes lbIn{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}
.lb-btn{position:fixed;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.12);border:none;color:var(--white);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--tr);z-index:9991}
.lb-btn:hover{background:rgba(255,255,255,0.25)}
.lb-close{top:18px;left:20px;font-size:1.5rem}
.lb-prev{top:50%;transform:translateY(-50%);right:16px}
.lb-next{top:50%;transform:translateY(-50%);left:16px}
.lb-caption{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);color:var(--white);font-size:1rem;font-weight:600;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);padding:8px 22px;border-radius:22px;white-space:nowrap}
.lb-dots{position:fixed;bottom:65px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.lb-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.35);cursor:pointer;transition:background var(--tr)}
.lb-dot.active{background:var(--white)}

/* PACKAGES */
.pkgs{padding:90px 20px;background:linear-gradient(160deg,var(--c) 0%,var(--white) 100%)}
.pkgs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:25px;max-width:1200px;margin:0 auto}
.pkg{background:var(--white);border-radius:22px;padding:40px 32px 36px;box-shadow:0 4px 28px rgba(0,0,0,0.07);transition:transform var(--tr),box-shadow var(--tr);position:relative;border:1.5px solid #EDE5DC;overflow:hidden}
.pkg::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--g),var(--pt))}
.pkg:hover{transform:translateY(-10px);box-shadow:0 24px 56px rgba(0,0,0,0.13)}
.pkg.featured{background:linear-gradient(160deg,#2C2318 0%,#3a2c20 100%);border-color:var(--g);transform:scale(1.04)}
.pkg.featured::after{height:0}
.pkg.featured:hover{transform:scale(1.04) translateY(-8px)}
.pkg-badge{position:absolute;top:20px;left:20px;background:linear-gradient(135deg,var(--g),var(--gd));color:var(--white);padding:5px 16px;border-radius:20px;font-size:0.75rem;font-weight:700;white-space:nowrap;box-shadow:0 4px 14px rgba(212,165,116,0.5);letter-spacing:0.03em}
.pkg-name{font-family:'Cormorant Garamond','Frank Ruhl Libre',Georgia,serif;font-size:2rem;margin-bottom:10px;font-weight:600;line-height:1}
.pkg.featured .pkg-name{color:var(--gl)}
.pkg-price{font-size:3rem;color:var(--g);font-weight:700;margin-bottom:3px;line-height:1;letter-spacing:-0.02em}
.pkg.featured .pkg-price{color:var(--gl)}
.pkg-sub{color:#aaa;margin-bottom:22px;font-size:0.85rem;padding-bottom:20px;border-bottom:1px solid #f0ece8}
.pkg.featured .pkg-sub{color:rgba(255,255,255,0.45);border-bottom-color:rgba(255,255,255,0.1)}
.pkg-feat{list-style:none;margin-bottom:20px}
.pkg-feat li{padding:10px 0;border-bottom:1px solid #f8f5f2;font-size:0.91rem;display:flex;align-items:center;gap:10px;color:#555}
.pkg.featured .pkg-feat li{border-bottom-color:rgba(255,255,255,0.08);color:rgba(255,255,255,0.82)}
.pkg-feat li::before{content:'✦';color:var(--g);font-size:0.72rem;flex-shrink:0}
.pkg.featured .pkg-feat li::before{color:var(--gl)}
.pkg-bonus{font-size:0.82rem;font-weight:600;margin-bottom:22px;padding:10px 14px;background:rgba(212,165,116,0.09);border-radius:10px;color:var(--gd);border:1px solid rgba(212,165,116,0.2)}
.pkg.featured .pkg-bonus{background:rgba(255,255,255,0.07);color:var(--gl);border-color:rgba(212,165,116,0.3)}
.pkg-btn{display:block;width:100%;text-align:center;background:linear-gradient(135deg,var(--g),var(--gd));color:var(--white);padding:14px 20px;border-radius:30px;text-decoration:none;font-weight:700;font-size:0.93rem;transition:all var(--tr);letter-spacing:0.02em;box-shadow:0 4px 16px rgba(212,165,116,0.3);cursor:pointer;border:none;font-family:inherit}
.pkg-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(212,165,116,0.45)}
.pkg.featured .pkg-btn{background:var(--g);box-shadow:0 6px 22px rgba(212,165,116,0.5)}

/* TESTIMONIALS */
.testimonials{padding:90px 20px;background:var(--white)}
.test-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(275px,1fr));gap:22px;max-width:1050px;margin:0 auto}
.test-card{background:var(--c);border-radius:var(--r);padding:30px;text-align:center;transition:transform var(--tr);position:relative;overflow:hidden}
.test-card::before{content:'"';font-family:'Frank Ruhl Libre',serif;font-size:6rem;color:var(--g);opacity:0.15;position:absolute;top:0;right:16px;line-height:1;pointer-events:none}
.test-card:hover{transform:translateY(-5px)}
.test-stars{font-size:1rem;margin-bottom:14px;letter-spacing:3px}
.test-text{font-size:0.96rem;color:var(--t);margin-bottom:14px;font-style:italic;position:relative;z-index:1;line-height:1.65}
.test-author{color:#aaa;font-size:0.82rem;font-weight:700;letter-spacing:0.06em}

/* FAQ */
.faq{padding:90px 20px;background:linear-gradient(135deg,var(--white),var(--c))}
.faq-list{max-width:780px;margin:0 auto}
.faq-item{border-bottom:1px solid rgba(212,165,116,0.22);overflow:hidden}
.faq-q{font-weight:700;font-size:1rem;padding:18px 0;color:var(--t);cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;gap:16px;transition:color var(--tr);line-height:1.4}
.faq-q:hover{color:var(--g)}
.faq-q::after{content:'＋';font-size:1.4rem;color:var(--g);transition:transform 0.35s ease;font-weight:300;flex-shrink:0}
.faq-item.open .faq-q{color:var(--g)}
.faq-item.open .faq-q::after{transform:rotate(45deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height 0.42s ease,padding 0.32s ease;color:#666;font-size:0.92rem;line-height:1.75}
.faq-item.open .faq-a{max-height:260px;padding-bottom:18px}

/* CONTACT */
.contact{padding:90px 20px;background:var(--c)}
.contact-inner{max-width:660px;margin:0 auto;text-align:center}
.contact-title{font-family:'Frank Ruhl Libre',Georgia,serif;font-size:2.4rem;margin-bottom:8px}
.contact-sub{color:#888;margin-bottom:40px;font-size:1rem}
.contact-quick{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:38px}
.cq-btn{display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:30px;text-decoration:none;font-size:1rem;font-weight:700;transition:all var(--tr);box-shadow:var(--shadow)}
.cq-wa{background:#25D366;color:var(--white)}
.cq-wa:hover{background:#1da851;transform:translateY(-3px);box-shadow:0 10px 28px rgba(37,211,102,0.35)}
.cq-phone{background:var(--g);color:var(--white)}
.cq-phone:hover{background:var(--gd);transform:translateY(-3px);box-shadow:0 10px 28px rgba(212,165,116,0.4)}
.contact-divider{display:flex;align-items:center;gap:16px;margin-bottom:28px;color:#bbb;font-size:0.88rem}
.contact-divider::before,.contact-divider::after{content:'';flex:1;height:1px;background:rgba(0,0,0,0.1)}

/* Contact Form */
.contact-form{background:var(--white);border-radius:var(--r);padding:32px;box-shadow:var(--shadow);text-align:right}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:0.87rem;font-weight:600;color:#666}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 14px;border:1.5px solid #e0d8d0;border-radius:10px;font-family:'Assistant',sans-serif;font-size:0.95rem;color:var(--t);background:var(--white);transition:border-color var(--tr),box-shadow var(--tr);outline:none;direction:rtl;appearance:none;-webkit-appearance:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(212,165,116,0.15)}
.form-group textarea{height:95px;resize:vertical;min-height:75px}
.form-full{grid-column:1/-1}
.form-submit{width:100%;padding:13px;background:var(--g);color:var(--white);border:none;border-radius:25px;font-family:'Assistant',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all var(--tr);margin-top:4px}
.form-submit:hover{background:var(--gd);transform:translateY(-2px);box-shadow:0 8px 22px rgba(212,165,116,0.4)}
.form-note{font-size:0.8rem;color:#aaa;margin-top:10px;text-align:center}
.success-card{text-align:center;padding:40px 20px;animation:fadeInUp 0.5s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.success-check{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#2E7D52,#4CAF7A);color:#fff;font-size:2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 8px 28px rgba(46,125,82,0.3)}
.success-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.8rem;font-weight:600;color:var(--t);margin-bottom:12px}
.success-body{color:#6B5A4E;line-height:1.8;font-size:1rem;margin-bottom:10px}
.success-mail{font-size:0.88rem;color:var(--g);font-weight:600;margin-bottom:24px}
.success-call{display:inline-block;background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;text-decoration:none;padding:12px 36px;border-radius:30px;font-weight:700;font-size:0.93rem;box-shadow:0 4px 16px rgba(212,165,116,0.35);transition:all var(--tr)}
.success-call:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(212,165,116,0.45)}
.contact-details{display:flex;flex-direction:column;gap:14px;margin-top:30px;align-items:center}

async function loadData(){
  try{
    var url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv';
    var res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    var csv=await res.text();
    var d={};
    csv.split('\n').forEach(function(line){
      line=line.trim();
      if(!line) return;
      var m=line.match(/^"?([^",\r\n]+)"?,\s*"?(.*?)"?\s*\r?$/);
      if(m&&m[1]&&m[2]&&m[1].trim()!=='key'){
        d[m[1].trim()]=m[2].trim();
      }
    });
    if(d.logo||d.cat1_name){
      var merged=Object.assign({},FB,d);
      return merged;
    }
    return FB;
  }catch(e){
    return FB;
  }
}

function renderLbDots(){
  var dots=document.getElementById('lbDots');
  if(!dots) return;
  dots.innerHTML=galItems.map(function(_,i){
    return '<div class="lb-dot'+(i===lbIndex?' active':'')+'" onclick="goLb('+i+')"></div>';
  }).join('');
}

function updateLbDots(){
  var all=document.querySelectorAll('.lb-dot');
  all.forEach(function(d,i){d.classList.toggle('active',i===lbIndex);});
}

function openLb(idx){
  lbIndex=idx;
  var lb=document.getElementById('lightbox');
  var img=document.getElementById('lbImg');
  var cap=document.getElementById('lbCaption');
  if(!lb||!img||!galItems[idx]) return;
  img.src=galItems[idx].src;
  img.alt=galItems[idx].name;
  if(cap) cap.textContent=galItems[idx].name;
  updateLbDots();
  lb.classList.add('active');
  document.body.style.overflow='hidden';
}

function closeLb(){
  var lb=document.getElementById('lightbox');
  if(lb) lb.classList.remove('active');
  document.body.style.overflow='';
}

function goLb(idx){
  if(galItems.length===0) return;
  lbIndex=((idx%galItems.length)+galItems.length)%galItems.length;
  openLb(lbIndex);
}

function initApp(){
  var bar=document.getElementById('scrollProg');
  window.addEventListener('scroll',function(){
    var doc=document.documentElement;
    var pct=window.scrollY/(doc.scrollHeight-doc.clientHeight);
    if(bar) bar.style.transform='scaleX('+Math.min(pct,1)+')';
    var nav=document.getElementById('navbar');
    if(nav) nav.classList.toggle('scrolled',window.scrollY>50);
    var bt=document.getElementById('backTop');
    if(bt) bt.classList.toggle('vis',window.scrollY>400);
    updateActiveNav();
  },{passive:true});

  // Reveal on scroll
  var obs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){e.target.classList.add('vis');obs.unobserve(e.target);}
    });
  },{threshold:0.08,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal').forEach(function(el){obs.observe(el);});

  // Counter animation
  var cObs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        var el=e.target;
        var target=+el.dataset.target;
        var steps=60,dur=1800,cur=0,inc=target/steps;
        var t=setInterval(function(){
          cur=Math.min(cur+inc,target);
          el.textContent=Math.round(cur).toLocaleString('he-IL');
          if(cur>=target){clearInterval(t);el.textContent=target.toLocaleString('he-IL');}
        },dur/steps);
        cObs.unobserve(el);
      }
    });
  },{threshold:0.3});
  document.querySelectorAll('[data-target]').forEach(function(el){cObs.observe(el);});

  // Lightbox controls
  var lb=document.getElementById('lightbox');
  if(lb){
    lb.addEventListener('click',function(e){if(e.target===lb)closeLb();});
    document.getElementById('lbClose').addEventListener('click',closeLb);
    document.getElementById('lbPrev').addEventListener('click',function(){goLb(lbIndex+1);});
    document.getElementById('lbNext').addEventListener('click',function(){goLb(lbIndex-1);});
    document.addEventListener('keydown',function(e){
      if(!lb.classList.contains('active')) return;
      if(e.key==='Escape') closeLb();
      if(e.key==='ArrowLeft'||e.key==='ArrowDown') goLb(lbIndex-1);
      if(e.key==='ArrowRight'||e.key==='ArrowUp') goLb(lbIndex+1);
    });
    // Touch swipe
    var tx=0;
    lb.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
    lb.addEventListener('touchend',function(e){
      var dx=e.changedTouches[0].clientX-tx;
      if(Math.abs(dx)>50) goLb(dx>0?lbIndex-1:lbIndex+1);
    });
  }
}

function updateActiveNav(){
  var secs=['home','gallery','pkgs','testimonials','faq','contact'];
  var y=window.scrollY+120;
  secs.forEach(function(id){

    document.querySelectorAll('[data-sec="'+id+'"]').forEach(function(a){
      a.classList.toggle('active',inView);
    });
  });
}

        var m=line.match(/^"?([^",\r\n]+)"?,\s*"?(.*?)"?\s*\r?$/);
        if(m&&m[1]&&m[2]&&m[1].trim()!=='key') d[m[1].trim()]=m[2].trim();
      });
    }
  }catch(e){}
  // 2. content.json overrides (admin edits)
  try{
    var cr=await fetch('content.json?v='+Date.now(),{cache:'no-store'});
    if(cr.ok){var cd=await cr.json();Object.assign(d,cd);}
  }catch(e){}
  // 3. gallery.json overrides cat images (admin-managed gallery order)
  try{
    var gr=await fetch('gallery.json?v='+Date.now(),{cache:'no-store'});
    if(gr.ok){
      var gal=await gr.json();
      gal.forEach(function(slot,i){
        var n=i+1;
        if(slot.name) d['cat'+n+'_name']=slot.name;
        if(slot.file) d['cat'+n+'_image']=RAW_BASE+slot.file;
        if(slot.desc) d['cat'+n+'_desc']=slot.desc;
      });
      // Clear any slots beyond gallery length
      for(var x=gal.length+1;x<=8;x++){d['cat'+x+'_name']='';d['cat'+x+'_image']='';}
    }
  }catch(e){}
  return d;
}

var RAW_BASE='https://raw.githubusercontent.com/y6765809-art/chaya-segal-images/main/';

loadAll().then(function(d){
  render(d);
  setTimeout(function(){
    var loading=document.getElementById('loading');
    if(loading) loading.classList.add('hidden');
  },350);
});
</script>
