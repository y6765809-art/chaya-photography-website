<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חיה סגל צילום</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#fff}#app{}</style>
</head>
<body>
<div id="app">טוען... ⏳</div>
<script>
const S='1Q9NOZyg_gFb-qQbjnYL7N_mH_gxHlOWU';
const U=`https://docs.google.com/spreadsheets/d/${S}/gviz/tq?tqx=out:json`;
const CSS=`*{margin:0;padding:0;box-sizing:border-box}:root{--g:#D4A574;--c:#F2DFCE;--p:#F5C6D0;--t:#2C2C2C;--b:#1A1A1A}body{font-family:'Assistant',sans-serif;background:#fff;color:var(--t);line-height:1.6}.navbar{position:fixed;top:0;left:0;right:0;background:rgba(255,255,255,0.98);backdrop-filter:blur(10px);box-shadow:0 2px 20px rgba(0,0,0,0.1);z-index:999;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}.nav-logo{height:50px}.nav-menu{display:flex;gap:30px;list-style:none}.nav-menu a{text-decoration:none;color:var(--t);font-weight:500;cursor:pointer;font-size:1.05rem}.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--c) 0%,#fff 50%,var(--p) 100%);padding-top:80px;text-align:center}.logo-img{max-width:400px;margin-bottom:30px}.tagline{font-size:1.5rem;margin-bottom:20px}.highlight{font-size:2.2rem;font-weight:700;color:var(--g);margin-bottom:20px}.gallery{padding:100px 20px 80px}.section-title{font-size:2.5rem;text-align:center;margin-bottom:15px}.section-sub{text-align:center;color:#666;margin-bottom:60px;font-size:1.1rem}.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;max-width:1200px;margin:0 auto}.card{border-radius:20px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.1)}.card img{width:100%;height:300px;object-fit:cover}.card-info{padding:25px;background:#fff}.card-name{font-size:1.8rem;font-weight:700;margin-bottom:8px}.card-desc{color:#666}.pkgs{padding:80px 20px;background:var(--c)}.pkgs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;max-width:1200px;margin:40px auto 0}.pkg{background:#fff;border-radius:20px;padding:40px;box-shadow:0 10px 40px rgba(0,0,0,0.1)}.pkg-name{font-size:2rem;font-weight:700;margin-bottom:15px}.pkg-price{font-size:2.5rem;color:var(--g);font-weight:700;margin-bottom:8px}.pkg-sub{color:#666;margin-bottom:20px}.pkg-feat{list-style:none}.pkg-feat li{padding:10px 0;border-bottom:1px solid #f0f0f0}.footer{background:var(--b);color:#fff;padding:60px 20px 30px;text-align:center}.footer h3{font-size:1.5rem;margin-bottom:20px}.footer p{margin:8px 0}.wa{position:fixed;bottom:30px;right:30px;background:#25D366;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 4px 15px rgba(37,211,102,0.4);z-index:1000}`;

fetch(U).then(r=>r.text()).then(t=>{
const j=JSON.parse(t.substring(47).slice(0,-2));
const d={};
j.table.rows.forEach((r,i)=>{if(i===0)return;const k=r.c[0]?.v,v=r.c[1]?.v;if(k&&v)d[k]=v;});
console.log('Data:',d);

let cats='';
for(let i=1;i<=5;i++){const n=d[`cat${i}_name`],img=d[`cat${i}_image`],desc=d[`cat${i}_desc`];if(n&&img)cats+=`<div class="card"><img src="${img}" alt="${n}"><div class="card-info"><div class="card-name">${n}</div><div class="card-desc">${desc||''}</div></div></div>`;}

let pkgs='';
for(let i=1;i<=4;i++){const n=d[`pkg${i}_name`],p=d[`pkg${i}_price`],s=d[`pkg${i}_subtitle`],f=d[`pkg${i}_features`];if(n&&p){const fl=f?f.split('|').map(x=>`<li>${x}</li>`).join(''):'';pkgs+=`<div class="pkg"><div class="pkg-name">${n}</div><div class="pkg-price">${p}</div><div class="pkg-sub">${s||''}</div><ul class="pkg-feat">${fl}</ul></div>`;}}

document.head.innerHTML+=`<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet"><style>${CSS}</style>`;

document.getElementById('app').innerHTML=`
<nav class="navbar"><img class="nav-logo" src="${d.logo||''}" alt="Logo"><ul class="nav-menu"><li><a onclick="document.getElementById('home').scrollIntoView({behavior:'smooth'})">דף הבית</a></li><li><a onclick="document.getElementById('gallery').scrollIntoView({behavior:'smooth'})">גלריה</a></li><li><a onclick="document.getElementById('pkgs').scrollIntoView({behavior:'smooth'})">מחירון</a></li><li><a onclick="document.getElementById('footer').scrollIntoView({behavior:'smooth'})">יצירת קשר</a></li></ul></nav>
<a href="https://wa.me/972548463238" class="wa" target="_blank">📱</a>
<div id="home" class="hero"><div><img class="logo-img" src="${d.logo||''}" alt="Logo"><div class="tagline">${d.hero_tagline||''}</div><div class="highlight">${d.hero_highlight||''}</div><div>${d.hero_subline||''}</div></div></div>
<div id="gallery" class="gallery"><h2 class="section-title">${d.gallery_title||'הגלריה שלנו'}</h2><p class="section-sub">${d.gallery_subtitle||''}</p><div class="cats">${cats}</div></div>
<div id="pkgs" class="pkgs"><h2 class="section-title">${d.packages_title||'מחירון 2026'}</h2><p class="section-sub">${d.packages_subtitle||''}</p><div class="pkgs-grid">${pkgs}</div></div>
<footer id="footer" class="footer"><h3>צרו קשר</h3><p>טלפון: ${d.contact_phone||''}</p><p>אימייל: ${d.contact_email||''}</p><p>מיקום: ${d.contact_location||''}</p><p style="margin-top:30px">© 2026 חיה סגל צילום</p></footer>`;
}).catch(e=>{console.error(e);document.getElementById('app').innerHTML='שגיעה ❌';});
</script>
</body>
</html>
